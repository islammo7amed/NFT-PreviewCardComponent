<!DOCTYPE html>
<html lang="en-US">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>NFT Preview Card Component</title>
		<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="css/style.css">
	</head>
	<body>
		<main>
			<article>
				<figure class="head-img">
					<img src="assets/images/image-equilibrium.jpg" alt="Equilibrium image">
					<div class="overlay"></div>
				</figure>
				<section>
					<h2><a id="equ" href="#">Equilibrium #3429</a></h2>
					<p class="parag">Our Equilibrium collection promotes balance and calm.</p>
					<div class="cont">
						<div class="content">
							<div><img src="assets/images/icon-ethereum.svg" alt="Ethereum"></div>
							<p class="eth">0.041 ETH</p>
						</div>
						<div class="content">
							<div><img src="assets/images/icon-clock.svg" alt="Clock"></div>
							<p class="time">3 days left</p>
						</div>
					</div>
				</section>
				<footer>
					<div>
						<img src="assets/images/image-avatar.png" alt="Avatar">
					</div>
					<p>Creation of <a href="#">Jules Wyvern</a></p>
				</footer>
			</article>
		</main>
	</body>
</html>
